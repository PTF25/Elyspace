<html lang="pt-br"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xatSpacely</title>
    <style>
        :root {
            --neon-pink: #cbda00;
            --soft-pink: #ffffff;
            --white-pink: #ffe6f2;
            --neon-glow: 0 0 10px #006ef
            f, 0 0 20px #000000;
            --bg-dark: #000000;
            --bg-entry: #000000;
            --glass: rgba(201, 164, 1, 0.95);
        }

        /* --- Global Anti-Seleção --- */
        * {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* --- Efeito de Rastro de Cauda do Mouse (Comet Trail) --- */
        .cursor-trail {
            position: fixed;
            top: 0; left: 0;
            width: 12px;  /* Tamanho inicial da ponta */
            height: 12px;
            background: white; /* Cor da ponta */
            box-shadow: 0 0 10px white, 0 0 20px var(--neon-Blue), 0 0 30px var(--neon-Blue);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%); /* Centraliza no ponteiro */
            opacity: 1;
            transition: width 0.3s ease-out, height 0.3s ease-out, opacity 0.3s ease-out, background 0.3s ease-out;
        }

        /* --- Custom Scrollbar Neon --- */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(75, 67, 0, 0.05);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--neon-Blue);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--neon-Blue);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--soft-blue);
            box-shadow: 0 0 15px var(--soft-blue);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark); color: white;
            display: flex; justify-content: center; align-items: center;
        }

        /* --- Fundo Estrelado (Global) --- */
        #stars-bg {
            position: fixed; width: 100%; height: 100%; z-index: 1;
            background: radial-gradient(circle at center, #2a0314, #000000);
        }
        .stars {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(white, rgba(156, 158, 3, 0.356) 1px, transparent 2px);
            background-size: 200px 200px; animation: moveStars 100s linear infinite;
        }
        .twinkle {
            position: absolute; width: 2px; height: 2px; background: white;
            border-radius: 50%; opacity: 0; animation: flash 2s infinite ease-in-out;
        }
        @keyframes flash {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.8; transform: scale(1.2); box-shadow: 0 0 10px white; }
        }
        @keyframes moveStars { from { background-position: 0 0; } to { background-position: 1000px 1000px; } }

        /* --- Efeito Gradiente Animado --- */
        .animated-gradient {
            background: linear-gradient(270deg, #ffffff, var(--neon-Blue), #ffffff, var(--soft-blue));
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 5s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #copy-toast {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--neon-pink); color: white; padding: 15px 30px;
            border-radius: 50px; z-index: 10000; font-weight: bold; border: 2px solid white;
            box-shadow: 0 0 25px var(--neon-pink); text-transform: uppercase;
        }

        /* --- Tela de Entrada --- */
        #entry-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; 
            background-color: var(--bg-entry);
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        .welcome-title {
            font-size: 5rem; font-weight: bold; margin-bottom: 25px;
            font-family: 'Brush Script MT', cursive, sans-serif;
            text-shadow: 0 0 20px rgba(102, 92, 4, 0.4);
            position: relative; z-index: 101;
        }
        
        .btn-enter {
            padding: 15px 60px; font-size: 1.5rem; 
            color: white; 
            background: linear-gradient(135deg, var(--neon-pink) 0%, white 50%, var(--neon-pink) 100%);
            background-size: 200% auto;
            border: 2px solid var(--white-pink); border-radius: 50px; cursor: pointer;
            text-transform: uppercase; 
            box-shadow: 0 0 25px var(--neon-pink), 0 0 10px white;
            font-weight: bold; letter-spacing: 2px;
            position: relative; z-index: 101;
            animation: gradientMoveButton 2s linear infinite;
            transition: transform 0.3s;
        }

        .btn-enter:active { transform: scale(0.95); }

        @keyframes gradientMoveButton {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* --- Interface Principal --- */
        #main-interface {
            visibility: hidden; opacity: 0; position: relative; z-index: 10;
            display: flex; gap: 20px; align-items: flex-start;
            transition: opacity 1s ease;
        }
        #profile-card {
            width: 360px; background: var(--glass); border: 2px solid var(--neon-pink);
            border-radius: 20px; padding: 25px; box-shadow: var(--neon-glow);
            text-align: center; backdrop-filter: blur(10px);
        }
        #side-panel {
            width: 0; overflow: hidden; background: var(--glass);
            border-radius: 20px; transition: 0.5s ease-in-out; opacity: 0;
            backdrop-filter: blur(10px);
        }
        #side-panel.open {
            width: 480px; border: 2px solid var(--neon-pink);
            box-shadow: var(--neon-glow); padding: 25px; opacity: 1;
        }

        .profile-img { width: 140px; height: 140px; border-radius: 50%; border: 3px solid var(--neon-pink); margin-bottom: 15px; box-shadow: var(--neon-glow); object-fit: cover; }
        .menu-btn { display: block; width: 100%; padding: 12px; margin: 8px 0; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--neon-pink); color: white; border-radius: 8px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.2s; }
        .menu-btn:hover, .menu-btn.active { background: var(--neon-pink); box-shadow: var(--neon-glow); }

        .panel-content { display: none; max-height: 55vh; overflow-y: auto; }
        
        #color-list { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; padding: 5px; }
        .c-box { width: 100%; aspect-ratio: 1; border-radius: 2px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: transform 0.1s; }
        .c-box:hover { transform: scale(1.2); z-index: 5; border: 1px solid white; }

        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .photo-grid img { 
            width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; 
            cursor: pointer; border: 2px solid transparent; transition: 0.3s; 
        }
        .photo-grid img:hover { 
            border-color: var(--neon-pink); 
            box-shadow: 0 0 15px var(--neon-pink);
            transform: scale(1.05);
        }

        #photo-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000;
            justify-content: center; align-items: center; cursor: pointer;
        }
        #photo-modal img {
            max-width: 85%; max-height: 85%; border: 3px solid var(--neon-pink);
            border-radius: 15px; box-shadow: var(--neon-glow);
            cursor: default;
        }

        .player-container { margin-top: 20px; padding-top: 15px; border-top: 1px dashed var(--neon-pink); }
        .player-controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .player-btn { background: transparent; border: 1px solid var(--neon-pink); color: white; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .player-btn:hover { background: var(--neon-pink); }

        #alert-box { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--neon-pink); color: white; padding: 12px 25px; border-radius: 50px; z-index: 5000; font-weight: bold; box-shadow: var(--neon-glow); border: 1px solid white; }
    </style>
</head>

<script>
      const playlist = [
            { name: "Ana Gabriel - Simplemente Amigos", url: "https://mp3tourl.com/audio/1788479394621-19b68cff-4c09-4df0-a137-6379dde5fcef.mp3" },
            { name: "Vicente Fernández with Alejandro Fernández - Amor de los Dos", url: "https://mp3tourl.com/audio/1788479464745-f20c1781-669b-4b0b-a331-43e4b9f883fd.mp3" },
            { name: "Luis Miguel - Serenata huasteca", url: "https://mp3tourl.com/audio/1788479517901-b431b10c-0740-4be2-b6a1-a00bea24be26.mp3" }
        ];

    let currentTrack = 0;
    const player = document.getElementById('audio-player');

    createTwinklingStars('stars-bg');
    createTwinklingStars('entry-stars');

    /* --- LÓGICA DO RASTRO DE CAUDA (COMET TRAIL) --- */
    const trailSegments = [];
    const maxSegments = 20;

    document.addEventListener('mousemove', (e) => {
        const segment = document.createElement('div');
        segment.className = 'cursor-trail';
        segment.style.left = e.clientX + 'px';
        segment.style.top = e.clientY + 'px';
        document.body.appendChild(segment);
        trailSegments.push(segment);

        while (trailSegments.length > maxSegments) {
            trailSegments.shift().remove();
        }

        for (let i = 0; i < trailSegments.length; i++) {
            const seg = trailSegments[i];
            const ratio = i / trailSegments.length; 
            const size = 12 * ratio; 
            seg.style.width = size + 'px';
            seg.style.height = size + 'px';
            seg.style.opacity = ratio;

            if (ratio < 0.3) {
                seg.style.background = 'white';
            } else if (ratio < 0.6) {
                seg.style.background = 'var(--white-pink)';
            } else {
                seg.style.background = 'var(--neon-pink)';
            }
        }
    });

    document.addEventListener('mouseout', () => {
        while (trailSegments.length > 0) {
            trailSegments.shift().remove();
        }
    });

    // --- NOVA LÓGICA DE CONTADOR API ---
    async function updateCounter() {
        const ID_KEY = "xatspace_name_counter_2026"; // ID único para seu contador
        try {
            const res = await fetch(`https://api.counterapi.dev/v1/wrs-galeria/${ID_KEY}/up`);
            const data = await res.json();
            const count = (data.count || data.value).toString().padStart(5, '0');
            document.getElementById('v-count').innerText = count;
        } catch(e) {
            // Caso a API falhe, mostra 00001
            document.getElementById('v-count').innerText = "2026";
        }
    }

    function start() {
        document.getElementById('entry-page').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('entry-page').style.visibility = 'hidden';
            document.getElementById('main-interface').style.visibility = 'visible';
            document.getElementById('main-interface').style.opacity = '1';
        }, 800);
        loadTrack(0);
        player.play();
        updateCounter(); // Chama a nova função
        generateMasterTable();
    }

    function loadTrack(i) {
        player.src = playlist[i].url;
        document.getElementById('track-name').innerText = "Música: " + playlist[i].name;
    }

    function togglePlay() {
        if (player.paused) { player.play(); document.getElementById('play-btn').innerText = "⏸"; }
        else { player.pause(); document.getElementById('play-btn').innerText = "▶"; }
    }

    function nextTrack() { currentTrack = (currentTrack + 1) % playlist.length; loadTrack(currentTrack); player.play(); }
    function prevTrack() { currentTrack = (currentTrack - 1 + playlist.length) % playlist.length; loadTrack(currentTrack); player.play(); }
    function updateVolume(val) { player.volume = val; }

    function handleRightClick(e) {
        e.preventDefault();
        const alertBox = document.getElementById('alert-box');
        alertBox.style.display = 'block';
        setTimeout(() => { alertBox.style.display = 'none'; }, 2000);
    }

    function generateMasterTable() {
        const grid = document.getElementById('color-list');
        grid.innerHTML = '';
        for (let l = 100; l >= 0; l -= 10) addColorBox(0, 0, l, grid);
        for (let h = 0; h <= 360; h += 12) {
            for (let l = 30; l <= 70; l += 20) addColorBox(h, 90, l, grid);
        }
    }

    function addColorBox(h, s, l, container) {
        const hex = hslToHex(h, s, l);
        let d = document.createElement('div');
        d.className = 'c-box';
        d.style.background = hex;
        d.onclick = () => { 
            navigator.clipboard.writeText(hex);
            const toast = document.getElementById('copy-toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 1200);
        };
        container.appendChild(d);
    }

    function resetInterface() {
        document.getElementById('side-panel').classList.remove('open');
        document.querySelectorAll('.panel-content').forEach(pc => pc.style.display = 'none');
        document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
    }

    function openPanel(id) {
        const panel = document.getElementById('side-panel');
        if (panel.classList.contains('open') && document.getElementById(id).style.display === 'block') {
            resetInterface(); return;
        }
        resetInterface();
        panel.classList.add('open');
        document.getElementById(id).style.display = 'block';
        const btnId = 'btn-' + id.replace('-content', '');
        if(document.getElementById(btnId)) document.getElementById(btnId).classList.add('active');
    }

    function openPhoto(src) {
        const modal = document.getElementById('photo-modal');
        const img = document.getElementById('modal-img');
        img.src = src;
        modal.style.display = 'flex';
    }

    function createTwinklingStars(containerId) {
        const bg = document.getElementById(containerId);
        if (!bg) return;
        for (let i = 0; i < 60; i++) {
            let star = document.createElement('div');
            star.className = 'twinkle';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDelay = Math.random() * 5 + 's';
            bg.appendChild(star);
        }
    }

    function hslToHex(h, s, l) {
        l /= 100; const a = s * Math.min(l, 1 - l) / 100;
        const f = n => {
            const k = (n + h / 30) % 12;
            const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            return Math.round(255 * color).toString(16).padStart(2, '0');
        };
        return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
    }
